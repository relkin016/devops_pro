<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="DevOps Pro — офлайн-учебник и тренажёр к собеседованиям: Linux, сети, Docker, Kubernetes, Terraform, Ansible, CI/CD, мониторинг, траблшутинг.">
  <title>DevOps Pro</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233fb950'/%3E%3Ctext x='16' y='22' font-size='16' font-family='monospace' font-weight='700' text-anchor='middle' fill='%230d1117'%3E%3E_%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <script>
    try { var t = localStorage.getItem("devops-pro:theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/">
        <span class="brand-mark">&gt;_</span>
        <span class="brand-text"><strong>DevOps Pro</strong><small>учебник · собеседования · траблшутинг</small></span>
      </a>
      <nav class="nav" id="nav" aria-label="Темы"></nav>
      <div class="sidebar-foot">
        <button class="ghost-btn" id="theme-toggle" type="button" title="Сменить тему">◐ Тема</button>
        <span class="version" id="version"></span>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Меню">☰</button>
        <div class="search">
          <span class="search-ico" aria-hidden="true">⌕</span>
          <input id="search" type="search" autocomplete="off" spellcheck="false"
                 placeholder="Поиск: команда, ошибка, понятие…  (Ctrl+K или /)" aria-label="Поиск">
          <div class="search-results" id="search-results" hidden></div>
        </div>
        <a class="top-link" href="#/train">🎯 Тренажёр</a>
      </header>
      <div class="view" id="view" tabindex="-1"></div>
    </main>
  </div>

  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
